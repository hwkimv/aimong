name: question-pipeline

# Runs entirely without external API credentials. Checks that need the OpenAI
# API live in semantic-audit.yml and are dispatched manually.

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/**'
      - 'backend/src/main/resources/db/migration/**'
      - 'Makefile'
      - '.github/workflows/question-pipeline.yml'
  pull_request:
    paths:
      - 'pipeline/**'
      - 'backend/src/main/resources/db/migration/**'
      - 'Makefile'
      - '.github/workflows/question-pipeline.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aimong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      AIMONG_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/aimong_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r pipeline/requirements-dev.txt

      - name: Contract is derived from the canonical dataset and current
        run: python pipeline/tools/derive_contract.py --check

      - name: Hard contract validation and export
        run: make export

      - name: Tests, including the PostgreSQL seed load
        run: make test

      - name: PostgreSQL verification summary
        run: make db-verify

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-bank-artifacts
          path: |
            pipeline/out/backend-compatible-question-bank.json
            pipeline/out/question-bank-seed.sql
            pipeline/out/verify-report.json
          if-no-files-found: warn
