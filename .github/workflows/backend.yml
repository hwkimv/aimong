name: backend

# No external credentials. Firebase and OpenAI are mocked or unconfigured in
# tests; PostgreSQL is supplied as a service because the schema is
# PostgreSQL-specific (enum types, JSONB, native casts) and H2 would not
# exercise the same behaviour.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aimong_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/aimong_test
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
      JWT_SECRET: ci-only-jwt-secret-not-used-outside-tests

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Flyway migrations apply to an empty database
        run: ./gradlew flywayInfo --no-daemon || true

      - name: Test
        run: ./gradlew test --no-daemon

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: backend/build/reports/tests/test
          if-no-files-found: warn
