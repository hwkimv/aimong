name: semantic-audit

# Separated from the default pipeline CI because it calls a paid external API.
# The main workflow must stay green without any API credentials.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Why this audit is being run
        required: false
        default: manual review

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip -r pipeline/requirements-dev.txt

      - name: Fail early when the key is absent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY secret is not configured; this workflow is opt-in." >&2
            exit 1
          fi

      - name: Semantic similarity audit
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: echo "Embedding audit is not implemented yet; see docs/validation-strategy.md."
